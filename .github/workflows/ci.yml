# Lint、类型检查、Next 构建、Prisma 迁移 + seed、Playwright 冒烟（Chromium）
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://printfig:printfig@localhost:5432/printfig_ci
      NEXTAUTH_SECRET: ci-placeholder-secret-minimum-32-characters-long
      NEXT_TELEMETRY_DISABLED: "1"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: printfig
          POSTGRES_PASSWORD: printfig
          POSTGRES_DB: printfig_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U printfig -d printfig_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate (PostgreSQL)
        run: npx prisma migrate deploy

      - name: Seed database
        run: npx prisma db seed

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Next.js build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Playwright smoke
        run: npm run test:e2e
